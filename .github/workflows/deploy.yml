name: Deploy Shinylive App to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("shiny", "ggplot2", "shinylive"))'

      - name: Export Shinylive app
        run: |
          APP_PATH=$(find . -maxdepth 3 -name "app.R" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No se encontro el archivo app.R en el repositorio."
            ls -la
            exit 1
          fi
          APP_DIR=$(dirname "$APP_PATH")
          echo "Archivo app.R encontrado en: $APP_DIR"
          Rscript -e "shinylive::export(appdir = '$APP_DIR', destdir = '_site')"

      - name: Ensure .nojekyll exists
        run: |
          touch _site/.nojekyll

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
